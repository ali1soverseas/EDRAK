# Closed metric registry. Ids are what workers, the planner and the brief refer to.
# unit_kind: currency | count | percent | index | date | text
# visual: kpi | segmented | line | ladder | timeline | text
# preferred_sources: official = the entity's own site/filings; third_party = press, analysts; internal = uploaded docs
metrics:
  # ---- Competitor agent ----
  - id: price_per_tier
    name: {en: "Price per tier", ar: "السعر لكل باقة"}
    aliases: [pricing, plan price, price per seat, price per user]
    definition: "List price of each paid plan, per seat per month unless stated."
    reads_as: "Where each competitor prices its plans. Only plans priced the same way are compared."
    unit_kind: currency
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} pricing", "{entity} plans price per user"]
    check: {official_source_required: true}
    visual: ladder
    comparator: company
  - id: effective_price_usage
    name: {en: "Effective price under usage billing", ar: "السعر الفعلي عند الفوترة بالاستهلاك"}
    aliases: [usage price, overage price, cost per minute]
    definition: "Price per billed unit (e.g. CI minute, API call) beyond the included allowance."
    reads_as: "What a customer pays per unit beyond the plan allowance."
    unit_kind: currency
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} usage based pricing", "{entity} overage"]
    check: {official_source_required: true}
    visual: kpi
    comparator: company
  - id: paid_subscribers
    name: {en: "Paid subscribers", ar: "المشتركون المدفوعون"}
    aliases: [customers, paying customers, subscribers, active merchants]
    definition: "Number of paying customers or subscribers."
    reads_as: "How many paying customers each company has: its scale."
    unit_kind: count
    period: latest_reported
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} number of customers", "{entity} paying customers"]
    check: {}
    visual: kpi
    comparator: prior
  - id: revenue_arr
    name: {en: "Revenue or ARR", ar: "الإيرادات"}
    aliases: [arr, annual revenue, revenue]
    definition: "Annual revenue or annual recurring revenue, if publicly reported."
    reads_as: "Recurring revenue: how big each business is."
    unit_kind: currency
    period: fiscal_year
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} annual revenue", "{entity} ARR filing"]
    check: {official_source_required: true}
    visual: kpi
    comparator: prior
  - id: release_cadence
    name: {en: "Release cadence", ar: "وتيرة الإصدارات"}
    aliases: [release frequency, shipping cadence]
    definition: "Releases shipped per month or quarter."
    reads_as: "How often each company ships. Faster cadence means faster response to the market."
    unit_kind: count
    period: trailing_12m
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} release notes", "{entity} changelog"]
    check: {min_points: 3}
    visual: timeline
    comparator: prior
  - id: certifications
    name: {en: "Certifications", ar: "الشهادات"}
    aliases: [compliance, soc2, iso 27001, pci]
    definition: "Security and compliance certifications held."
    reads_as: "Which compliance certificates each company holds. Missing ones can block deals."
    unit_kind: count
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} security compliance certifications"]
    check: {official_source_required: true}
    visual: text
    comparator: company
  - id: funding_total
    name: {en: "Funding raised", ar: "التمويل المجمّع"}
    aliases: [funding, total raised]
    definition: "Total external funding raised to date."
    reads_as: "Money raised: how long each competitor can keep investing."
    unit_kind: currency
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} funding round raised"]
    check: {}
    visual: kpi
    comparator: none
  # ---- Market agent ----
  - id: market_size
    name: {en: "Market size", ar: "حجم السوق"}
    aliases: [tam, market value]
    definition: "Total addressable market value for the offering in the target market."
    reads_as: "How big the prize is in this market, for this offering."
    unit_kind: currency
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} {offering} market size"]
    check: {}
    visual: kpi
    comparator: prior
  - id: market_cagr
    name: {en: "Market growth (CAGR)", ar: "نمو السوق (CAGR)"}
    aliases: [cagr, growth rate]
    definition: "Compound annual growth rate of the market."
    reads_as: "How fast the market grows each year, over the period stated."
    unit_kind: percent
    period: forecast_range
    owner: market_intelligence
    preferred_sources: [third_party]
    query_hints: ["{market} {offering} CAGR forecast"]
    check: {}
    visual: kpi
    comparator: none
  - id: segment_growth
    name: {en: "Segment growth", ar: "نمو القطاع"}
    aliases: [segment cagr]
    definition: "Growth rate of the specific segment the offering targets."
    reads_as: "How fast the specific segment grows compared with the wider market."
    unit_kind: percent
    period: year
    owner: market_intelligence
    preferred_sources: [third_party]
    query_hints: ["{market} {offering} segment growth"]
    check: {min_points: 3}
    visual: line
    comparator: prior
  - id: adoption_rate
    name: {en: "Adoption rate", ar: "معدل التبني"}
    aliases: [penetration, adoption]
    definition: "Share of target customers already using the category."
    reads_as: "Share of target customers already using the category. Low means early; high means a fight for share."
    unit_kind: percent
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} {offering} adoption penetration"]
    check: {}
    visual: kpi
    comparator: prior
  - id: market_concentration
    name: {en: "Market concentration", ar: "تركّز السوق"}
    aliases: [market share, top players share]
    definition: "Share of the market held by the top players."
    reads_as: "How much of the market the leaders hold. High concentration means entry needs a clear edge."
    unit_kind: percent
    period: year
    owner: market_intelligence
    preferred_sources: [third_party]
    query_hints: ["{market} {offering} market share leaders"]
    check: {parts_sum_100: true}
    visual: segmented
    comparator: none
  - id: regulation_events
    name: {en: "Regulation events", ar: "الأحداث التنظيمية"}
    aliases: [regulation, licensing]
    definition: "Dated regulatory changes that affect the offering."
    reads_as: "Rules that change who can sell, what and when."
    unit_kind: date
    period: upcoming_and_recent
    owner: market_intelligence
    preferred_sources: [official]
    query_hints: ["{market} {offering} regulation law", "{market} {offering} export control licensing"]
    check: {official_source_required: true}
    visual: timeline
    comparator: none
  # ---- Customer agent ----
  - id: share_of_voice
    name: {en: "Share of voice", ar: "حصة الحديث"}
    aliases: [sov, mention share]
    definition: "Share of brand mentions among the company and its competitors."
    reads_as: "Share of customer conversation about each company, counted from the posts we read."
    unit_kind: percent
    period: time_window
    owner: customer_trends
    preferred_sources: [official]
    query_hints: []
    check: {parts_sum_100: true, min_sample: 30, min_platforms: 2}
    visual: segmented
    comparator: none
  - id: sentiment_split
    name: {en: "Sentiment split", ar: "توزيع المشاعر"}
    aliases: [sentiment]
    definition: "Positive, neutral and negative share of customer posts."
    reads_as: "How customers feel about each company, counted from the posts we read."
    unit_kind: percent
    period: time_window
    owner: customer_trends
    preferred_sources: [official]
    query_hints: []
    check: {parts_sum_100: true, min_sample: 30}
    visual: segmented
    comparator: none
  - id: rating
    name: {en: "Rating", ar: "التقييم"}
    aliases: [stars, review score]
    definition: "Average review rating on a public review site."
    reads_as: "Average public review score."
    unit_kind: index
    period: latest_reported
    owner: customer_trends
    preferred_sources: [third_party]
    query_hints: ["{entity} reviews rating"]
    check: {min_sample: 30}
    visual: kpi
    comparator: company
  - id: top_pain_points
    name: {en: "Top pain points", ar: "أبرز نقاط الألم"}
    aliases: [complaints, pain points]
    definition: "Most frequent complaint themes with their share of mentions."
    reads_as: "What customers complain about most."
    unit_kind: percent
    period: time_window
    owner: customer_trends
    preferred_sources: [official]
    query_hints: []
    check: {min_sample: 30}
    visual: ladder
    comparator: none
  - id: switching_intent
    name: {en: "Switching intent", ar: "نية التحويل"}
    aliases: [churn intent, considering switching]
    definition: "Share of posts expressing intent to switch away from or to a vendor."
    reads_as: "Share of customers saying they want to switch."
    unit_kind: percent
    period: time_window
    owner: customer_trends
    preferred_sources: [official]
    query_hints: []
    check: {min_sample: 30}
    visual: kpi
    comparator: none
  - id: search_interest
    name: {en: "Search interest", ar: "الاهتمام البحثي"}
    aliases: [google trends, demand]
    definition: "Relative search interest over time (0-100)."
    reads_as: "Search demand over time, 0 to 100, where 100 is the peak in the period shown. Read the trend, not one value."
    unit_kind: index
    period: time_window
    owner: customer_trends
    preferred_sources: [third_party]
    query_hints: []
    check: {min_points: 3}
    visual: line
    comparator: prior
  # ---- Internal agent ----
  - id: own_price
    name: {en: "Our price", ar: "سعرنا"}
    aliases: [our pricing, list price, internal price, target asp]
    definition: "The company's own price for the offering, from internal documents."
    reads_as: "Our own price, from internal documents."
    unit_kind: currency
    period: point_in_time
    owner: internal_intelligence
    preferred_sources: [internal]
    query_hints: ["pricing sheet", "price list"]
    check: {}
    visual: kpi
    comparator: none
  - id: win_loss
    name: {en: "Win/loss rate", ar: "معدل الفوز والخسارة"}
    aliases: [win rate, loss rate, win/loss, deal win rate]
    definition: "Share of competitive deals won."
    reads_as: "Share of competitive deals we win."
    unit_kind: percent
    period: quarter
    owner: internal_intelligence
    preferred_sources: [internal]
    query_hints: ["win loss analysis"]
    check: {min_sample: 10}
    visual: segmented
    comparator: prior
  - id: capacity
    name: {en: "Delivery capacity", ar: "الطاقة التشغيلية"}
    aliases: [headcount, capacity, team capacity, delivery capacity, headcount capacity]
    definition: "Team or delivery capacity available for the initiative."
    reads_as: "How much the team can take on for this initiative."
    unit_kind: count
    period: point_in_time
    owner: internal_intelligence
    preferred_sources: [internal]
    query_hints: ["capacity plan", "headcount"]
    check: {}
    visual: kpi
    comparator: none
  - id: roadmap_items
    name: {en: "Roadmap commitments", ar: "التزامات خارطة الطريق"}
    aliases: [roadmap, milestone, release target]
    definition: "Dated roadmap commitments relevant to the decision."
    reads_as: "Dated commitments on our roadmap."
    unit_kind: date
    period: upcoming
    owner: internal_intelligence
    preferred_sources: [internal]
    query_hints: ["roadmap"]
    check: {}
    visual: timeline
    comparator: none
  # ---- Infrastructure and hardware offerings (used when the company sells hardware or infrastructure) ----
  - id: unit_price
    name: {en: "Price per unit", ar: "السعر لكل وحدة"}
    aliases: [price per gpu, price per accelerator, system price, price per hour, gpu hour price]
    definition: "Reported price of one unit of the offering: one product, one system, one course, one service, or one hour of use."
    reads_as: "Where each supplier prices one unit. Only units of the same kind are compared."
    unit_kind: currency
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} {offering} price per unit", "{entity} {offering} price per hour"]
    check: {}
    visual: ladder
    comparator: company
  - id: infra_investment
    name: {en: "Committed investment", ar: "الاستثمار الملتزم به"}
    aliases: [government investment, national programme funding, sovereign fund commitment, announced investment]
    definition: "Public and private money committed to the offering in the target market: government programmes, sovereign funds and data-centre builds."
    reads_as: "How much buyers in this market have committed to spend. Larger commitments mean a bigger near-term prize."
    unit_kind: currency
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} {offering} investment billion", "{market} government {offering} programme funding"]
    check: {}
    visual: kpi
    comparator: none
  - id: dc_capacity
    name: {en: "Data-centre capacity", ar: "سعة مراكز البيانات"}
    aliases: [data center capacity, megawatts, it load, power capacity]
    definition: "Data-centre power capacity installed or planned in the target market, in megawatts."
    reads_as: "How much computing the market can host. It caps how many systems can be deployed there."
    unit_kind: quantity
    period: year
    owner: market_intelligence
    preferred_sources: [third_party, official]
    query_hints: ["{market} data center capacity MW", "{market} data centre pipeline megawatts"]
    check: {}
    visual: kpi
    comparator: prior
  - id: deal_size
    name: {en: "Comparable deal size", ar: "حجم الصفقات المماثلة"}
    aliases: [contract value, deal value, signed contract, procurement]
    definition: "Value of signed contracts for the offering in the target market, such as national or government compute deals."
    reads_as: "What one customer in this market has actually paid. A guide to the size of a first contract."
    unit_kind: currency
    period: point_in_time
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} {offering} contract signed", "{market} {offering} deal value"]
    check: {}
    visual: kpi
    comparator: none
  - id: supply_capacity
    name: {en: "Supply capacity", ar: "الطاقة الإنتاجية"}
    aliases: [supply, allocation, units available, production capacity, shipments, cowos capacity]
    definition: "Units the company can supply for the initiative in the period (systems, accelerators, wafers), from internal documents."
    reads_as: "How much the company can deliver. Compare it with the demand the market figures imply."
    unit_kind: count
    period: point_in_time
    owner: internal_intelligence
    preferred_sources: [internal]
    query_hints: ["supply plan", "allocation"]
    check: {}
    visual: kpi
    comparator: none
  # ---- Financial services (fintech) ----
  - id: fee_rate
    name: {en: "Fee per transaction", ar: "الرسوم لكل معاملة"}
    aliases: [transaction fee, merchant discount rate, mdr, processing fee, take rate]
    definition: "Fee charged per transaction, as a percentage of the amount or a flat amount."
    reads_as: "What each provider charges per transaction. Merchants compare this first."
    unit_kind: percent
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} transaction fees", "{entity} pricing merchant fee"]
    check: {official_source_required: true}
    visual: ladder
    comparator: company
  - id: transaction_volume
    name: {en: "Transaction volume", ar: "حجم المعاملات"}
    aliases: [total payment volume, tpv, gross transaction value, processed volume]
    definition: "Total value of transactions processed in a period."
    reads_as: "How much money flows through each provider: its real scale."
    unit_kind: currency
    period: year
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} total payment volume", "{entity} transaction volume processed"]
    check: {}
    visual: kpi
    comparator: company
  - id: active_users
    name: {en: "Active users", ar: "المستخدمون النشطون"}
    aliases: [active customers, monthly active users, mau, active accounts, merchants]
    definition: "Users, customers or merchants active in a period, as reported by the company."
    reads_as: "How many people actually use each provider."
    unit_kind: count
    period: latest_reported
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} active users", "{entity} number of customers"]
    check: {}
    visual: kpi
    comparator: company
  # ---- Retail and consumer ----
  - id: site_count
    name: {en: "Locations", ar: "عدد المواقع"}
    aliases: [stores, branches, outlets, clinics, hubs, locations]
    definition: "Number of physical locations operated: stores, branches, clinics, warehouses or hubs."
    reads_as: "How much physical reach each company has in the market."
    unit_kind: count
    period: latest_reported
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} number of stores", "{entity} locations branches"]
    check: {}
    visual: kpi
    comparator: company
  - id: avg_order_value
    name: {en: "Average order value", ar: "متوسط قيمة الطلب"}
    aliases: [basket size, aov, average ticket, average spend]
    definition: "Average amount a customer spends per order or visit."
    reads_as: "How much a customer spends each time. Higher means fewer orders are needed to break even."
    unit_kind: currency
    period: year
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} average order value", "{entity} basket size"]
    check: {}
    visual: kpi
    comparator: company
  - id: ecommerce_share
    name: {en: "Online share of sales", ar: "حصة المبيعات عبر الإنترنت"}
    aliases: [e-commerce penetration, online penetration, online sales share]
    definition: "Share of the category's sales in the market made online."
    reads_as: "How much of this market buys online. It decides how much a physical network matters."
    unit_kind: percent
    period: year
    owner: market_intelligence
    preferred_sources: [third_party, official]
    query_hints: ["{market} {offering} online sales share", "{market} e-commerce penetration {offering}"]
    check: {}
    visual: kpi
    comparator: prior
  - id: category_spend
    name: {en: "Consumer spending on the category", ar: "إنفاق المستهلكين على الفئة"}
    aliases: [consumer spending, household spending, category spending, retail sales]
    definition: "What households in the market spend on the category in a year."
    reads_as: "The money customers already spend on this category: the pool a new entrant competes for."
    unit_kind: currency
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} consumer spending {offering}", "{market} {offering} retail sales value"]
    check: {}
    visual: kpi
    comparator: prior
  # ---- Logistics ----
  - id: shipment_volume
    name: {en: "Shipment volume", ar: "حجم الشحنات"}
    aliases: [parcels, shipments, deliveries, parcel volume, orders delivered]
    definition: "Parcels, shipments or deliveries handled in a period."
    reads_as: "How much each company moves: its operating scale."
    unit_kind: count
    period: year
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} shipments per day", "{entity} parcels delivered"]
    check: {}
    visual: kpi
    comparator: company
  - id: shipping_rate
    name: {en: "Shipping rate", ar: "سعر الشحن"}
    aliases: [delivery fee, shipping price, rate per kg, rate card]
    definition: "Published price per shipment or per kilogram for a standard delivery."
    reads_as: "What each carrier charges for a standard delivery."
    unit_kind: currency
    period: point_in_time
    owner: competitor_intelligence
    preferred_sources: [official]
    query_hints: ["{entity} shipping rates", "{entity} delivery price per kg"]
    check: {official_source_required: true}
    visual: ladder
    comparator: company
  - id: lpi_score
    name: {en: "Logistics Performance Index", ar: "مؤشر الأداء اللوجستي"}
    aliases: [lpi, logistics performance index]
    definition: "The World Bank Logistics Performance Index score for the market, from 1 to 5."
    reads_as: "How well the market's roads, ports and customs work, from 1 (poor) to 5 (best)."
    unit_kind: index
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} logistics performance index score"]
    check: {}
    visual: kpi
    comparator: none
  # ---- Healthcare ----
  - id: patient_volume
    name: {en: "Patients served", ar: "عدد المرضى"}
    aliases: [patients, visits, consultations, admissions]
    definition: "Patients served or visits in a period, as reported by the provider."
    reads_as: "How many patients each provider serves: its scale."
    unit_kind: count
    period: year
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} patients served", "{entity} annual patient visits"]
    check: {}
    visual: kpi
    comparator: company
  - id: health_spend
    name: {en: "Health spending per person", ar: "الإنفاق الصحي للفرد"}
    aliases: [health expenditure per capita, healthcare spending]
    definition: "Total health spending per person in the market per year."
    reads_as: "How much is spent on health per person: the ability to pay for the offering."
    unit_kind: currency
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} health expenditure per capita"]
    check: {}
    visual: kpi
    comparator: prior
  - id: insurance_coverage
    name: {en: "Health insurance coverage", ar: "نسبة التغطية التأمينية"}
    aliases: [insured population, insurance penetration, coverage rate]
    definition: "Share of the market's population with health insurance."
    reads_as: "How many people have insurance that could pay for the offering."
    unit_kind: percent
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} health insurance coverage percentage"]
    check: {}
    visual: kpi
    comparator: prior
  # ---- Education ----
  - id: enrollment
    name: {en: "Learners enrolled", ar: "عدد المتعلمين"}
    aliases: [students, learners, enrolled students, enrolments]
    definition: "Students or learners enrolled with the provider, as reported."
    reads_as: "How many learners each provider has: its scale."
    unit_kind: count
    period: latest_reported
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} number of students", "{entity} learners enrolled"]
    check: {}
    visual: kpi
    comparator: company
  - id: completion_rate
    name: {en: "Completion rate", ar: "معدل الإتمام"}
    aliases: [graduation rate, course completion]
    definition: "Share of enrolled learners who complete the course or programme."
    reads_as: "How many learners finish: a measure of outcome quality."
    unit_kind: percent
    period: year
    owner: competitor_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{entity} completion rate"]
    check: {}
    visual: ladder
    comparator: company
  - id: learner_population
    name: {en: "Learner population", ar: "عدد الطلاب في السوق"}
    aliases: [student population, school enrolment, university enrolment]
    definition: "Students enrolled in the relevant level of education in the market."
    reads_as: "How many potential learners the market holds."
    unit_kind: count
    period: year
    owner: market_intelligence
    preferred_sources: [official, third_party]
    query_hints: ["{market} {offering} student enrolment total"]
    check: {}
    visual: kpi
    comparator: prior
