[project]
name = "edrak"
version = "0.1.0"
description = "EDRAK agentic business decision-intelligence platform backend"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-ollama",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "tenacity",
    "structlog",
    "pyyaml",
    "trafilatura",
    "langdetect",
    "streamlit",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edrak"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: tests that call real external services, skipped by default"]
